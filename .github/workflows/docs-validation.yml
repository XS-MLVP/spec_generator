name: docs-validation

on:
  pull_request:
  push:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Render and validate Sbuffer v2.0.1
        run: make lint MODULE=Sbuffer VERSION=v2.0.1
