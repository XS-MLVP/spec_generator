name: docs-validation

on:
  pull_request:
  push:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate repository-owned files
        run: make repo-lint
      - name: Render template diagrams
        run: make template-check
