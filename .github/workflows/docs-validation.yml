name: docs-validation

on:
  pull_request:
  push:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate generic Skill and current schema
        run: |
          bash -n tools/*.sh
          python3 -m py_compile tools/*.py
          ./tools/validate_repository.py
          ./tools/preflight.sh --module Sbuffer --config DefaultConfig --strict --document-tools
          ./tools/validate_mermaid.py \
            --document templates/chip-design-document/chip_design_document_template_zh.md \
            --output-dir .cache/mermaid-check/template
