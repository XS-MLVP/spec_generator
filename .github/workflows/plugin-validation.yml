name: plugin-validation

on:
  pull_request:
  push:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the native architecture for macOS builds
        if: runner.os == 'macOS'
        # wavekit uses -march=native, which cannot target both universal2 architectures.
        run: printf 'ARCHFLAGS=-arch %s\n' "$(uname -m)" >> "$GITHUB_ENV"
      - name: Install UCAgent from the verified source revision
        # UCAgent is not published on PyPI; satisfy the plugin dependency first.
        run: python -m pip install 'UCAgent @ git+https://github.com/XS-MLVP/UCAgent.git@856ee9f9fd68cac09bda2f6495c55d96c6857038'
      - name: Install plugin and test tools
        run: python -m pip install -e '.[dev]'
      - name: Validate repository-owned files
        run: make repo-lint
      - name: Validate source plugin and runtime
        run: |
          make plugin-check
          make test
      - name: Render template diagrams
        run: make template-check
      - name: Build distributions and validate installed plugin
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          ucagent --validate-plugin xiangshan-spec-generator
          python -I -m pytest -q --import-mode=append -o pythonpath=''
