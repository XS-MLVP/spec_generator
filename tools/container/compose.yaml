# Optional evidence-tool preflight from the repository workspace.
services:
  docs:
    build:
      context: ../..
      dockerfile: tools/container/Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - template-generate-cache:/workspace/.cache
    environment:
      SPEC_GENERATOR_CACHE: /workspace/.cache
    command: sleep infinity

volumes:
  template-generate-cache:
